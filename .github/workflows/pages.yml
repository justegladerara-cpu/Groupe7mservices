name: Mettre en ligne

# Construit le site et le publie dans la branche gh-pages (servie par GitHub Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-24.04
    env:
      # Adresse et clé PUBLIQUE du projet Supabase (les données sont protégées par les règles RLS).
      VITE_SUPABASE_URL: https://ytwyvufkfrmghreqrctv.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_OpHPdBIr-_ieHzKSJvup9A_cLHq5_XJ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publier dans gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Site du ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
